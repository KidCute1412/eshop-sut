name: Newman API Test

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  newman-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install backend dependencies
        run: |
          cd backend
          npm ci

      - name: Start backend server
        run: |
          cd backend
          node server.js > /tmp/eshop-server.log 2>&1 &
          for i in $(seq 1 20); do
            if curl -s http://localhost:3000/api/products/1 > /dev/null; then
              break
            fi
            sleep 1
          done

      - name: Run Newman tests
        run: |
          cd api-testing
          ../backend/node_modules/.bin/newman run mini-login.postman_collection.json \
            --environment mini-local.postman_environment.json \
            --iteration-data mini-login.data.json \
            --reporters cli,json \
            --reporter-json-export mini-newman-report.json

      - name: Upload Newman report
        uses: actions/upload-artifact@v4
        with:
          name: newman-report
          path: api-testing/mini-newman-report.json
