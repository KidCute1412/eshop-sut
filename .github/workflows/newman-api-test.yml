name: Newman API tests

on:
  push:
  pull_request:

jobs:
  newman:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci
      - name: Install Newman
        run: npm install --global newman
      - name: Start backend and wait for readiness
        run: |
          node backend/server.js > backend.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:3000/api/products/1 > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat backend.log
          exit 1
      - name: Run data-driven Newman collection
        run: |
          newman run docs/assignments/HW06/schools/23127404/mini-product-by-id.postman_collection.json \
            --environment docs/assignments/HW06/schools/23127404/mini-local.postman_environment.json \
            --iteration-data docs/assignments/HW06/schools/23127404/mini-product-by-id.data.json \
            --reporters cli,json \
            --reporter-json-export docs/assignments/HW06/schools/23127404/mini-newman-report.json
      - name: Upload Newman report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mini-newman-report
          path: docs/assignments/HW06/schools/23127404/mini-newman-report.json
          if-no-files-found: warn
