name: Newman API Tests

on:
  push:
    branches:
      - '23127296*'
  workflow_dispatch:

jobs:
  api-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci

      - name: Start backend server
        working-directory: ./backend
        run: |
          node server.js > server.log 2>&1 &
          echo "Backend PID: $!"
          sleep 8
          cat server.log || true

      - name: Verify backend is running
        run: |
          for i in {1..15}; do
            if curl -s http://localhost:3000/api/products > /dev/null 2>&1; then
              echo "Backend is ready after attempt $i"
              exit 0
            fi
            echo "Waiting for backend... attempt $i/15"
            sleep 3
          done
          echo "Backend failed to start after 15 attempts"
          cat backend/server.log || true
          exit 1

      - name: Install Newman
        run: npm install -g newman

      - name: Run Newman collection and export JSON report
        run: |
          newman run mini_exercise_api/mini-products.postman_collection.json \
            --environment mini_exercise_api/mini-local.postman_environment.json \
            --iteration-data mini_exercise_api/mini-products.data.json \
            --reporters cli,json \
            --reporter-json-export mini_exercise_api/mini-newman-report.json

      - name: Upload Newman report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: newman-report
          path: mini_exercise_api/mini-newman-report.json
          retention-days: 7
