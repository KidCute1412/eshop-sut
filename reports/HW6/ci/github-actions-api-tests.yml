name: HW6 API Tests

on:
  push:
    paths:
      - "backend/**"
      - "reports/HW6/**"
      - ".github/workflows/**"
  workflow_dispatch:

jobs:
  newman:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install backend dependencies
        working-directory: backend
        run: npm install
      - name: Reset database
        working-directory: backend
        run: node database.js
      - name: Prepare report directory
        run: mkdir -p reports/HW6/newman
      - name: Start backend
        working-directory: backend
        run: nohup node server.js > ../reports/HW6/newman/backend.log 2>&1 &
      - name: Install wait-on
        run: npm install -g wait-on
      - name: Wait for backend
        run: wait-on http://127.0.0.1:3000/api/products --timeout 60000
      - name: Show backend log
        if: always()
        run: cat reports/HW6/newman/backend.log || true
      - name: Run Newman
        continue-on-error: true
        env:
          HTTP_PROXY: ""
          HTTPS_PROXY: ""
          ALL_PROXY: ""
          NO_PROXY: "localhost,127.0.0.1"
        run: npx newman run reports/HW6/postman/HW06_FR01_FR07_FR17.postman_collection.json -e reports/HW6/postman/HW06_local.postman_environment.json --env-var baseUrl=http://127.0.0.1:3000 --env-var studentId=23127539 --reporters cli,html --reporter-html-export reports/HW6/newman/report.html
      - name: Upload Newman report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: HW6-newman-report
          path: reports/HW6/newman/
