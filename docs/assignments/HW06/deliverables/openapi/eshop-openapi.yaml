openapi: 3.0.3
info:
  title: EShop Backend API Specification
  version: 2.0.0
  description: Complete OpenAPI 3.0 specification for EShop Backend SUT used in HW06 API Testing.
servers:
  - url: http://localhost:3000
    description: Local Development & Testing Server

paths:
  /api/login:
    post:
      summary: User and Admin Authentication
      description: Authenticates user credentials and issues JWT token. Tracks consecutive login failures and locks account for 30s after 3 failures.
      tags:
        - Authentication
      parameters:
        - in: header
          name: X-Student-Id
          schema:
            type: string
            example: "23127404"
          required: true
          description: Student ID audit header
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: test@eshop.com
                password:
                  type: string
                  format: password
                  example: Test1234!
      responses:
        '200':
          description: Authentication successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Login successful
                  token:
                    type: string
                    example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                  user:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 2
                      name:
                        type: string
                        example: Test User
                      email:
                        type: string
                        example: test@eshop.com
                      role:
                        type: string
                        example: user
        '401':
          description: Invalid email or password
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Invalid email or password
        '403':
          description: Account is temporarily locked
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Tài khoản đã bị khóa. Vui lòng thử lại sau.

  /api/checkout:
    post:
      summary: Order Checkout
      description: Creates a new order in pending state and empties user shopping cart.
      tags:
        - Cart & Checkout
      security:
        - BearerAuth: []
      parameters:
        - in: header
          name: X-Student-Id
          schema:
            type: string
            example: "23127404"
          required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - total_amount
                - shipping_address
              properties:
                total_amount:
                  type: integer
                  minimum: 1
                  example: 500000
                shipping_address:
                  type: string
                  example: 123 Le Loi, Q1, TP.HCM
      responses:
        '200':
          description: Checkout successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Checkout successful
                  orderId:
                    type: integer
                    example: 1
        '401':
          description: Unauthorized - missing token
        '403':
          description: Forbidden - invalid token

  /api/admin/orders/{id}/status:
    put:
      summary: Admin Order Status Transition
      description: Updates order state according to the 5-state lifecycle state machine. Requires role=admin.
      tags:
        - Admin Orders
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: Order ID
        - in: header
          name: X-Student-Id
          schema:
            type: string
            example: "23127404"
          required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum: [pending, confirmed, shipping, delivered, canceled]
                  example: confirmed
      responses:
        '200':
          description: Order status updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Order status updated
        '400':
          description: Invalid state transition
        '403':
          description: Forbidden - user is not admin
        '404':
          description: Order not found

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
