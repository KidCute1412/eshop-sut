name: Automated Newman API Testing Pipeline

on:
  push:
    branches: [ main, master, 23127404-LeTuanLoc ]
  pull_request:
    branches: [ main, master, 23127404-LeTuanLoc ]
  workflow_dispatch:

jobs:
  api-testing:
    name: Run Newman Postman Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Codebase
        uses: actions/checkout@v4

      - name: 2. Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: 'backend/package-lock.json'

      - name: 3. Install Backend Dependencies
        working-directory: backend
        run: npm ci || npm install

      - name: 4. Install Newman CLI
        run: npm install -g newman

      - name: 5. Execute isolated, evidence-preserving Newman suite
        run: node scripts/run_hw06_verified_evidence.js

      - name: 6. Upload Newman Execution Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-api-test-reports
          path: docs/assignments/HW06/deliverables/newman-reports/
